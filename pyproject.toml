[tool.poetry]
name = "gl-codes"
version = "0.1.0"
description = "API for predicting General Ledger codes for financial transactions using FAISS and Cohere"
authors = ["rdibari1@gmail.com"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.2"
uvicorn = "^0.34.0"
pydantic = "^2.11.3"
python-dotenv = "^1.1.0"
cohere = "^5.14.2"
numpy = "^2.2.4"
pandas = "^2.2.3"
python-multipart = "^0.0.20"
faiss-cpu = "^1.10.0"
scikit-learn = "^1.6.1"
tqdm = "^4.67.1"
sentence-transformers = "^4.0.2"
joblib = "^1.4.2"
pydantic-settings = "^2.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.1"
pytest-cov = "^4.1.0"

[tool.poetry.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
dev = "uvicorn app.main:app --reload"
format = "black app tests"
lint = "flake8 app tests"
typecheck = "mypy app"
test = "pytest -v tests"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12.4"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false